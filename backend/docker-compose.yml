version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: pathfinder-db
    environment:
      POSTGRES_DB: pathfinder_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: