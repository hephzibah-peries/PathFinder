spring.profiles.active=supabase

# Database Settings
spring.datasource.url=jdbc:postgresql://db.qqfzznkcvctinkvkmeac.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=YOUR_SUPABASE_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL Settings
spring.jpa.hibernate.ddl-auto=update
