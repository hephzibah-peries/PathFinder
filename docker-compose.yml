services:
  postgres:
    image: postgres:18-alpine
    container_name: pathfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathfinder_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kiru1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pathfinder_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pathfinder-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathfinder-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pathfinder_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: kiru1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
    ports:
      - "8080:8080"
    networks:
      - pathfinder-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pathfinder-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - pathfinder-network

networks:
  pathfinder-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

