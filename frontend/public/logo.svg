<svg viewBox="0 0 540 720" xmlns="http://www.w3.org/2000/svg">
  <!-- Graduation Cap -->
  <path d="M 200 180 L 270 120 L 340 180 Z" fill="#1E90FF" />
  <rect x="200" y="180" width="140" height="20" fill="#1E90FF" />
  
  <!-- Tassel -->
  <line x1="340" y1="185" x2="360" y2="280" stroke="#1E90FF" stroke-width="8" />
  <circle cx="360" cy="290" r="12" fill="#1E90FF" />
  
  <!-- Padlock Body (Upper) -->
  <rect x="180" y="240" width="180" height="120" rx="20" fill="#0047AB" />
  
  <!-- Padlock Shackle (Arc) -->
  <path d="M 220 240 Q 220 160 270 160 Q 320 160 320 240" fill="none" stroke="#0047AB" stroke-width="30" />
  <path d="M 220 240 Q 220 160 270 160 Q 320 160 320 240" fill="none" stroke="#1E90FF" stroke-width="20" />
  
  <!-- Handshake inside padlock -->
  <g opacity="0.9">
    <!-- Left hand -->
    <path d="M 210 310 Q 200 330 210 350 L 260 340" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" />
    <!-- Right hand -->
    <path d="M 330 310 Q 340 330 330 350 L 280 340" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" />
    <!-- Handshake middle -->
    <ellipse cx="270" cy="345" rx="25" ry="20" fill="#FFFFFF" />
  </g>
  
  <!-- Lock mechanism dot -->
  <circle cx="270" cy="360" r="8" fill="#FFFFFF" />
</svg>